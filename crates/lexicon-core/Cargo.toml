[package]
name = "lexicon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VRF minting, uniqueness ledger, and style linter for meridian-lexicon"
repository.workspace = true

[dependencies]
curve25519-dalek.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
rand.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rusqlite.workspace = true
zeroize.workspace = true
time.workspace = true
ml-dsa = { version = "0.1.1", optional = true }

[features]
default = []
# ML-DSA (FIPS 204) event signatures. Off by default so a plain
# `cargo build` stays Ed25519-only; `cargo build --features pq`
# enables ML-DSA-65 signing and verification.
pq = ["ml-dsa"]

[dev-dependencies]
proptest = "1.6"
tempfile = "3"
