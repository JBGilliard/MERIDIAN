[workspace]
resolver = "2"
members = ["crates/lexicon-core", "crates/lexicon-cli", "crates/lexicon-pools"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jbgilliard/MERIDIAN"
homepage = "https://github.com/jbgilliard/MERIDIAN"
description = "Open-source registry, deconfliction, and nomenclature for the intelligence community"
authors = ["MERIDIAN contributors"]
rust-version = "1.80"

[workspace.dependencies]
lexicon-core = { path = "crates/lexicon-core", version = "0.1.0" }
lexicon-pools = { path = "crates/lexicon-pools", version = "0.1.0" }
curve25519-dalek = { version = "4.1", features = ["digest", "legacy_compatibility"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
sha2 = "0.10"
digest = "0.10"
rand = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

[profile.release]
panic = "abort"
strip = "symbols"
lto = true
codegen-units = 1
opt-level = 3
