name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: fmt clippy test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: clippy hsm
        run: cargo clippy -p lexicon-core --features hsm --all-targets -- -D warnings
      - name: test hsm
        run: cargo test -p lexicon-core --features hsm

  fips:
    name: fips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cmake ninja go
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build golang-go
      - name: clippy fips
        run: cargo clippy -p lexicon-core -p lexicon-cli --features fips --all-targets -- -D warnings
      - name: test fips
        run: cargo test -p lexicon-core -p lexicon-cli --features fips

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  highside:
    name: highside
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check highside
        run: cargo check -p lexicon-cli --features highside

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: build release
        run: cargo build --release -p lexicon-cli
      - name: generate sbom
        run: ./scripts/sbom.sh
      - name: upload sbom
        uses: actions/upload-artifact@v4
        with:
          name: lexicon-sbom
          path: target/release/lexicon.cdx.json
